<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffb3d0">

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="manifest" href="site.webmanifest">
<title>Jardín para Mamá 🌸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="garden">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="celestial"></div>
  <div id="cloudsContainer"></div>
  <div id="ground"></div>
  <div id="grassContainer"></div>
  <div id="flowersContainer"></div>
  <div id="butterfliesContainer"></div>
  <button id="resetBtn">🔄 Repetir</button>


  <div id="message">
    <h2>✨ Para la mamá más especial del mundo ✨</h2>
    <p>
      Mamá, eres la raíz de todo lo bonito<br>
      que florece en mi vida.<br>
      Gracias por cuidarme con amor infinito<br>
      incluso en los días más difíciles.
    </p>
    <div class="hearts">🌸 💖 🌸</div>
  </div>

  <div id="startScreen">
    <h1>🌸 Un jardín especial<br>para mamá 🌸</h1>
    <p>Presiona el botón para hacer florecer el jardín</p>
    <button id="startBtn">Hacer florecer ✨</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
